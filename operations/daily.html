<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>풍림전자 — 하루 노선도</title>
<!--
  operations/daily.html   v1.0   (2026-09-20)
  ★sales.html 은 한 글자도 안 건드린다. 이 파일은 «옆에» 선다.
  ★되돌리기 = 이 파일을 지운다.
  ★서버 = sales-dashboard.gs doGet 한 줄 + 23_daily_ops.gs
  ★접속코드 키 'poonglim_sales_code' — sales.html · suppliers.html 과 «같은 키»
-->
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1b1f24; --dim:#6b7280;
    --blue:#1d4ed8; --blue-soft:#eff4ff; --green:#15803d; --green-soft:#ecfdf3;
    --red:#b91c1c; --red-soft:#fef2f2; --amber:#b45309; --amber-soft:#fffbeb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",
                   "Apple SD Gothic Neo",sans-serif;
       font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 72px}

  /* ── 머리 ── */
  header{position:sticky;top:0;z-index:40;background:var(--bg);
         padding:12px 0 10px;border-bottom:1px solid var(--line)}
  .h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .hsub{font-size:13px;color:var(--dim);margin-top:2px}
  .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .hbtns{display:flex;gap:6px;flex-wrap:wrap}

  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
         background:#fff;color:var(--ink);padding:8px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{padding:5px 9px;font-size:13px}
  button.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  button.warn{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700}
  button.ghost{background:#fff;color:var(--blue);border-color:#c7d6f7}

  /* ── 걸음 ── */
  .step{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px 14px;margin-top:10px;display:flex;gap:12px;align-items:flex-start}
  .step.done{background:var(--green-soft);border-color:#bbf0cd}
  .step.auto{background:#fafbfc}
  .tm{flex:0 0 58px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;
      color:var(--blue);padding-top:2px}
  .step.auto .tm{color:var(--dim)}
  .body{flex:1;min-width:0}
  .ttl{font-weight:700}
  .desc{font-size:13.5px;color:var(--dim);margin-top:3px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;
       padding:2px 8px;margin-left:6px;vertical-align:2px}
  .tag.a{background:#eef2f6;color:var(--dim)}
  .tag.n{background:var(--blue-soft);color:var(--blue)}
  .chk{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
  .chk input{width:26px;height:26px;cursor:pointer}
  .at{font-size:11px;color:var(--green);font-weight:700;min-height:14px}

  /* ── ⑨ 버튼판 ── */
  .panel{background:var(--card);border:2px solid var(--blue);border-radius:12px;
         padding:14px;margin-top:10px}
  .panel h3{margin:0 0 2px;font-size:17px}
  .grp{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .grp h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--blue);
       color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
  .btns{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .out{margin-top:9px;font-size:13px;border-radius:8px;padding:9px 11px;display:none;
       white-space:pre-wrap;word-break:break-all;font-variant-numeric:tabular-nums}
  .out.ok{display:block;background:var(--green-soft);border:1px solid #bbf0cd;color:#14532d}
  .out.info{display:block;background:var(--blue-soft);border:1px solid #cfe0ff;color:#1e3a8a}
  .out.bad{display:block;background:var(--red-soft);border:1px solid #fecaca;color:var(--red)}
  .out.busy{display:block;background:#f3f4f6;border:1px solid var(--line);color:var(--dim)}
  .out a{color:inherit;font-weight:800}
  .big{font-size:18px;font-weight:800}
  .note{font-size:12.5px;color:var(--amber);background:var(--amber-soft);
        border:1px solid #fde68a;border-radius:8px;padding:7px 10px;margin-top:8px}
  input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--line);
                   border-radius:8px;width:110px}

  /* ── 잠금 ── */
  #gate{position:fixed;inset:0;z-index:100;background:#0f172a;color:#e2e8f0;
        display:none;align-items:center;justify-content:center;padding:20px}
  #gate .box{background:#1e293b;border:1px solid #334155;border-radius:14px;
             padding:26px;width:100%;max-width:340px;text-align:center}
  #gate h2{margin:0 0 6px;font-size:19px}
  #gate p{margin:0 0 16px;font-size:13.5px;color:#94a3b8}
  #gate input{width:100%;padding:12px;font-size:17px;text-align:center;letter-spacing:.14em;
              border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0}
  #gate button{width:100%;margin-top:12px;padding:12px;background:var(--blue);
               border-color:var(--blue);color:#fff;font-weight:700;font-size:16px}
  #gmsg{min-height:20px;margin-top:10px;font-size:13px;color:#fca5a5}
  .foot{margin-top:22px;font-size:12px;color:var(--dim);text-align:center}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>풍림전자 업무 화면</h2>
    <p>접속코드를 넣어 주세요</p>
    <input id="gcode" type="password" inputmode="numeric" autocomplete="off" placeholder="● ● ● ● ● ●">
    <button id="gbtn">들어가기</button>
    <div id="gmsg"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="hrow">
      <div>
        <div class="h1">하루 노선도</div>
        <div class="hsub" id="hsub">불러오는 중…</div>
      </div>
      <div class="hbtns">
        <button class="sm ghost" id="btnReload">새로고침</button>
        <button class="sm" id="btnTest">자가진단</button>
        <button class="sm" id="btnLogout">코드 지우기</button>
      </div>
    </div>
    <div class="out" id="topOut"></div>
  </header>

  <div id="steps"></div>

  <div class="foot">
    daily.html v1.0 · 체크는 매일 0시에 저절로 비워집니다<br>
    ⛔ 이 주소를 밖으로 공유하지 않습니다 — 대표님·실장님·인수인계 두 분까지
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   0. 상수
   ═══════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/'
          + 'AKfycbyMAXL5KWdG12J6i6jA8B_7cRhdsvBbBT46aOf5YV-BlJ8Wb2tZ5wQb7p4X9SHoBQCfFQ'
          + '/exec';
const CODE_KEY = 'poonglim_sales_code';   /* ★sales.html · suppliers.html 과 같은 키 */

/* ═══════════════════════════════════════════════════════════
   1. 노선도 — ⓐ매출 한 바퀴 + ⓑ매입 발주서 + ⓒ송장회신
   ═══════════════════════════════════════════════════════════ */
const STEPS = [
  { id:'s00', tm:'아침',  ttl:'어제 파일이 남아 있으면 [완료]로 옮긴다',
    desc:'발주총괄_업로드 폴더. ★파일이 둘이면 매출 01번이 조용히 멈춘다' },

  { id:'s02', tm:'12:10', ttl:'윈세이 발주서 (마감 12:45)',
    desc:'1단계 로그의 「발주총괄 로드 N건」을 본다.\n★290~310 이 정상. ★절반 이하면 멈춘다' },

  { id:'s03', tm:'13:1x', ttl:'NY 주문서를 NY에 올리고 → 포털 [3]',
    desc:'13:00 사방넷 2차 → 13:03 발주총괄 도착 → 13:1x NY 주문서가 나온다' },

  { id:'s3b', tm:'13:0x', ttl:'스타리온·캐리어 발주서', auto:true,
    desc:'워처 v33a 가 1단계 직후 저절로 만든다' },

  { id:'s04', tm:'13:55', ttl:'NY 송장수집 시작 (17:30까지)',
    desc:'⚠️빈 창을 닫지 않는다' },

  { id:'s05', tm:'14:00', ttl:'송장 한 바퀴 → 사방넷에 송장 업로드',
    desc:'★사방넷 3차(15:40)보다 «먼저» 끝낸다\n⚠️송장업로드 파일이 둘 이상 나올 수 있다 — 전부 올린다' },

  { id:'s5b', tm:'14:1x', ttl:'5_송장회신_시작하기 더블클릭 → 10분 뒤 메일 발송',
    desc:'[거래처송장회신] 폴더에서 파일을 꺼내 거래처에 보낸다' },

  { id:'s5c', tm:'—',     ttl:'거래처회신 [16] → [17] → [17-1] → [18]', neu:true,
    desc:'★시트 메뉴에 다 있다. ⛔[19]는 사방넷 수집부터 하므로 누르지 않는다' },

  { id:'s06', tm:'15:2x', ttl:'ERP 자료 넷이 저절로 내려온다', auto:true,
    desc:'출고현황 · 발주현황 · 발주상세 · 입고' },

  { id:'s08', tm:'16:3x', ttl:'96탭 담기 · 출고 되받기 · 주문등록 파일', auto:true,
    desc:'16:35 96탭 · 16시대 되받기 · 16:42 주문등록 파일' },

  { id:'s9a', tm:'16:45', ttl:'주문등록 파일을 ERP에 올리고 → 포털 [9]',
    desc:'⚠️[9]는 «올렸는지»를 안 본다. ★반드시 올린 «뒤»에 누른다' }
];

/* ═══════════════════════════════════════════════════════════
   2. 접속코드
   ═══════════════════════════════════════════════════════════ */
function getCode(){ try{ return localStorage.getItem(CODE_KEY) || ''; }catch(e){ return ''; } }
function saveCode(v){ try{ localStorage.setItem(CODE_KEY, v); }catch(e){} }
function clearCode(){ try{ localStorage.removeItem(CODE_KEY); }catch(e){} }

function showGate(msg){
  document.getElementById('gmsg').textContent = msg || '';
  document.getElementById('gate').style.display = 'flex';
  setTimeout(()=>document.getElementById('gcode').focus(), 60);
}
function hideGate(){ document.getElementById('gate').style.display = 'none'; }
function isCodeError(msg){ return String(msg||'').indexOf('접속코드') >= 0; }

/* ═══════════════════════════════════════════════════════════
   3. 서버 부르기
   ═══════════════════════════════════════════════════════════ */
async function call(action, extra){
  const q = new URLSearchParams(Object.assign({ action, code:getCode() }, extra||{}));
  const res  = await fetch(API + '?' + q.toString(), { method:'GET' });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch(e){ throw new Error('서버가 JSON 이 아닌 것을 돌려주었습니다 — ' + text.slice(0,120)); }
  if (data && data.error){
    if (isCodeError(data.error)){ clearCode(); showGate(data.error); }
    throw new Error(data.error);
  }
  return data;
}

/* ═══════════════════════════════════════════════════════════
   4. 결과에서 숫자·파일 찾아내기
      ★칸 이름을 못 박지 않는다. 후보를 두고 «먼저 찾은 것»이 이긴다 (원칙 ㊻)
   ═══════════════════════════════════════════════════════════ */
function digAll(obj, out){
  out = out || [];
  if (obj && typeof obj === 'object'){
    out.push(obj);
    for (const k in obj){
      const v = obj[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) digAll(v, out);
    }
  }
  return out;
}
function pick(root, keys){
  const nodes = digAll(root);
  for (const k of keys)
    for (const n of nodes)
      if (Object.prototype.hasOwnProperty.call(n, k) && n[k] !== null && n[k] !== '')
        return n[k];
  return null;
}
const COUNT_KEYS = ['담길건수','담김','성공건수','옮김','맞춘것'];
const BLOCK_KEYS = ['막힘','막힌것'];
/* 12번은 «칸을 따로» 돌려준다. 14·17번은 «한 덩어리»로 돌려준다. 둘 다 받는다 */
const MISS_KEYS  = ['주문못찾음','주문모호','창고못찾음','고객못찾음','품번대체',
                    '이미완료','모호','없음','보류'];
function sizeOf(v){
  if (v === null || v === undefined || v === '') return 0;
  if (Array.isArray(v)) return v.length;
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}
function missLines(root, block){
  const out = [];
  if (block && typeof block === 'object'){
    for (const k in block){ const n = sizeOf(block[k]); if (n) out.push(`  ${k} ${n}`); }
  }
  const nodes = digAll(root);
  for (const k of MISS_KEYS)
    for (const n0 of nodes)
      if (Object.prototype.hasOwnProperty.call(n0, k)){
        const n = sizeOf(n0[k]); if (n) out.push(`  ${k} ${n}`);
        break;
      }
  return out.join('\n');
}
const FILE_KEYS  = ['파일명'];
const URL_KEYS   = ['파일URL','파일url'];

/* ═══════════════════════════════════════════════════════════
   5. ⑨ ERP 네 걸음 — 버튼판
   ═══════════════════════════════════════════════════════════ */
const GROUPS = [
  { key:'ship', num:'2', ttl:'출고등록',
    note:'⚠️담길건수가 ★100건을 넘으면 ERP에 100건씩 끊어 올립니다',
    btns:[
      { a:'shipSync',     t:'① 되받기',      w:true  },
      { a:'shipPreview',  t:'② 미리보기',    w:false, gate:true },
      { a:'shipGenerate', t:'③ 파일 만들기', w:true,  needs:'shipPreview' },
      { a:'shipArchive',  t:'④ 올린 파일 보관', w:true }
    ]},
  { key:'po', num:'3', ttl:'발주등록',
    note:'⚠️만든 파일은 ★손으로 [완료] 폴더로 옮깁니다. ⛔[9]를 누르지 않습니다',
    btns:[
      { a:'poPreview',  t:'① 미리보기',    w:false, gate:true },
      { a:'poGenerate', t:'② 파일 만들기', w:true,  needs:'poPreview' }
    ]},
  { key:'rcv', num:'4', ttl:'입고등록',
    note:'⚠️만들기 «직전»에 97 · 97b · 97c 셋이 새것인지 봅니다.\n⛔[9]를 누르지 않고, 파일은 ★손으로 [완료] 폴더로 옮깁니다',
    ym:true,
    btns:[
      { a:'rcvPreview',  t:'① 미리보기',    w:false, gate:true },
      { a:'rcvGenerate', t:'② 파일 만들기', w:true,  needs:'rcvPreview' }
    ]}
];

/* ═══════════════════════════════════════════════════════════
   6. 그리기
   ═══════════════════════════════════════════════════════════ */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const host = document.getElementById('steps');
  let h = '';

  for (const s of STEPS){
    const cls = s.auto ? 'step auto' : 'step';
    const tag = s.auto ? '<span class="tag a">자동</span>'
              : (s.neu ? '<span class="tag n">새 걸음</span>' : '');
    h += `<div class="${cls}" id="row-${s.id}">
      <div class="tm">${esc(s.tm)}</div>
      <div class="body">
        <div class="ttl">${esc(s.ttl)}${tag}</div>
        <div class="desc">${esc(s.desc)}</div>
      </div>`;
    h += s.auto
      ? `<div class="chk"><span class="at" id="at-${s.id}"></span></div></div>`
      : `<div class="chk">
           <input type="checkbox" id="cb-${s.id}" data-step="${s.id}">
           <span class="at" id="at-${s.id}"></span>
         </div></div>`;
  }

  /* ⑨ 버튼판 */
  h += `<div class="panel">
    <h3>16:45 &nbsp;⑨ ERP 네 걸음</h3>
    <div class="desc">★순서대로 갑니다. ⚠️담김이 0이면 ★만들지 않고 거기서 끝냅니다</div>

    <div class="grp">
      <h4><span class="num">1</span> 주문등록</h4>
      <div class="desc">주문등록 파일을 ERP에 올린 «뒤» 포털에서 [9]를 누릅니다.
      ⇒ 위 16:45 줄에서 체크하십시오</div>
    </div>`;

  for (const g of GROUPS){
    h += `<div class="grp">
      <h4><span class="num">${g.num}</span> ${esc(g.ttl)}</h4>
      <div class="btns">`;
    if (g.ym){
      h += `<span style="font-size:13.5px;color:#6b7280">대상월</span>
            <input type="text" id="ym-${g.key}" placeholder="2026-09">`;
    }
    for (const b of g.btns){
      const cls = b.w ? 'go' : 'ghost';
      const dis = b.needs ? ' disabled' : '';
      h += `<button class="${cls}" id="b-${b.a}" data-act="${b.a}" data-grp="${g.key}"${dis}>${esc(b.t)}</button>`;
    }
    h += `</div><div class="out" id="out-${g.key}"></div>`;
    if (g.note) h += `<div class="note">${esc(g.note)}</div>`;
    h += `</div>`;
  }
  h += `</div>`;
  host.innerHTML = h;

  host.querySelectorAll('input[type=checkbox]').forEach(el=>{
    el.addEventListener('change', ()=>toggleStep(el.dataset.step, el.checked));
  });
  host.querySelectorAll('button[data-act]').forEach(el=>{
    el.addEventListener('click', ()=>runAction(el.dataset.act, el.dataset.grp));
  });
}

/* ═══════════════════════════════════════════════════════════
   7. 체크
   ═══════════════════════════════════════════════════════════ */
function paintState(st){
  document.getElementById('hsub').textContent =
    `${st.date}  ·  지금 ${st.지금}  ·  ${Object.keys(st.steps||{}).length} 걸음 마침`;
  for (const s of STEPS){
    const hit = st.steps && st.steps[s.id];
    const at  = document.getElementById('at-' + s.id);
    const row = document.getElementById('row-' + s.id);
    const cb  = document.getElementById('cb-' + s.id);
    if (at)  at.textContent = hit ? hit.t : '';
    if (row) row.classList.toggle('done', !!hit);
    if (cb)  cb.checked = !!hit;
  }
}
async function loadState(){
  try { paintState(await call('dayGet')); }
  catch(e){ top_(('불러오지 못했습니다 — ' + e.message), 'bad'); }
}
async function toggleStep(step, on){
  try { paintState(await call('daySet', { step, on: on ? '1' : '0' })); }
  catch(e){ top_(('저장하지 못했습니다 — ' + e.message), 'bad'); loadState(); }
}

/* ═══════════════════════════════════════════════════════════
   8. 버튼 실행
   ═══════════════════════════════════════════════════════════ */
const lastCount = {};

function out_(key, msg, cls){
  const el = document.getElementById('out-' + key);
  el.className = 'out ' + cls;
  el.innerHTML = msg;
}
function top_(msg, cls){
  const el = document.getElementById('topOut');
  el.className = 'out ' + cls;
  el.textContent = msg;
  if (cls === 'ok' || cls === 'info') setTimeout(()=>{ el.className='out'; }, 9000);
}

async function runAction(action, key){
  const meta = GROUPS.find(g=>g.key===key).btns.find(b=>b.a===action);
  const btn  = document.getElementById('b-' + action);

  if (meta.w && !confirm(`[${meta.t.replace(/^[①②③④]\s*/,'')}] 을(를) 실행합니다.\n계속할까요?`)) return;

  document.querySelectorAll('button[data-act]').forEach(b=>b.disabled = true);
  out_(key, '돌고 있습니다… (길면 1~2분 걸립니다. ★창을 닫지 마십시오)', 'busy');

  const extra = {};
  if (key === 'rcv'){
    const v = (document.getElementById('ym-rcv').value || '').trim();
    if (v) extra.ym = v;
  }

  try{
    const r     = await call(action, extra);
    const cnt   = pick(r, COUNT_KEYS);
    const fname = pick(r, FILE_KEYS);
    const furl  = pick(r, URL_KEYS);
    const ym    = pick(r, ['대상월']);
    const stop  = pick(r, ['중단사유']);      /* ★17번 1247~1259행 — 탭이 없거나 비면 여기로 */
    const summ  = pick(r, ['요약']);          /* ★12번이 사람 말로 만들어 둔 줄 */
    const block = pick(r, BLOCK_KEYS);        /* 17번 막힘 · 14번 막힌것 */
    const label = meta.t.replace(/^[①②③④]\s*/,'');

    let html = '', cls = 'ok';

    if (!meta.w || action === 'shipPreview' || action === 'poPreview' || action === 'rcvPreview'){
      lastCount[key] = (cnt === null ? -1 : Number(cnt));
    }

    /* ⛔ 앞 단계가 «막은» 것 — 담김 0 과 다르다. 그대로 보여준다 (원칙 ⑰) */
    if (stop){
      lastCount[key] = -1;
      out_(key, `<div class="big">${esc(label)} — ⛔ 멈췄습니다</div>\n${esc(stop)}`, 'bad');
    } else {
      if (cnt !== null){
        html += `<div class="big">${esc(label)} — 담김 ${esc(cnt)} 건</div>`;
        if (Number(cnt) === 0){
          cls = 'info';
          html += '⚠️ 담김이 0 입니다. ★만들지 않고 여기서 끝냅니다.';
        }
      } else {
        html += `<div class="big">${esc(label)} — 끝났습니다</div>`;
      }
      if (ym)    html += `\n대상월 ${esc(ym)}`;
      if (fname) html += `\n파일 ${esc(fname)}`;
      if (furl)  html += `\n<a href="${esc(furl)}" target="_blank" rel="noopener">▶ 파일 열기</a>`;

      const miss = missLines(r, block);
      if (miss)  html += `\n\n안 담긴 것 —\n${esc(miss)}`;
      if (summ)  html += `\n\n${esc(String(summ).slice(0, 600))}`;
      out_(key, html, cls);
    }

    /* 미리보기 결과로 [만들기] 버튼을 켠다 */
    for (const g of GROUPS) for (const b of g.btns){
      if (b.needs){
        const e2 = document.getElementById('b-' + b.a);
        const c  = lastCount[g.key];
        e2.dataset.ready = (typeof c === 'number' && c > 0) ? '1' : '';
      }
    }
  } catch(e){
    out_(key, '⛔ ' + esc(e.message), 'bad');
  } finally {
    document.querySelectorAll('button[data-act]').forEach(b=>{
      const g = GROUPS.find(x=>x.key===b.dataset.grp);
      const m = g.btns.find(x=>x.a===b.dataset.act);
      b.disabled = m.needs ? (b.dataset.ready !== '1') : false;
    });
    loadState();
  }
}

/* ═══════════════════════════════════════════════════════════
   9. 머리 버튼
   ═══════════════════════════════════════════════════════════ */
document.getElementById('btnReload').addEventListener('click', loadState);
document.getElementById('btnLogout').addEventListener('click', ()=>{
  if (confirm('이 기기에서 접속코드를 지웁니다. 다음에 다시 넣어야 합니다.')){
    clearCode(); showGate('');
  }
});
document.getElementById('btnTest').addEventListener('click', async ()=>{
  top_('자가진단 중…', 'busy');
  try{
    const r = await call('daySelfTest');
    top_(r.ok ? `✅ 자가진단 통과 — 함수 ${r.찾음.length}개 · 대상월 ${r.대상월}`
              : `⛔ 못 찾은 함수 — ${r.못찾음.join(', ')}`, r.ok ? 'ok' : 'bad');
  }catch(e){ top_('⛔ ' + e.message, 'bad'); }
});
document.getElementById('gbtn').addEventListener('click', enter);
document.getElementById('gcode').addEventListener('keydown', e=>{ if (e.key === 'Enter') enter(); });

async function enter(){
  const v = document.getElementById('gcode').value.trim();
  if (!v){ document.getElementById('gmsg').textContent = '접속코드를 넣어 주세요'; return; }
  saveCode(v);
  document.getElementById('gmsg').textContent = '확인하는 중…';
  try{
    const st = await call('dayGet');
    hideGate(); document.getElementById('gcode').value = '';
    paintState(st);
  }catch(e){
    if (!isCodeError(e.message)) document.getElementById('gmsg').textContent = e.message;
  }
}

/* ═══════════════════════════════════════════════════════════
   10. 시작
   ═══════════════════════════════════════════════════════════ */
(async function boot(){
  render();
  if (!getCode()){ showGate(''); return; }
  try{
    const st = await call('dayGet');
    hideGate();
    paintState(st);
  }catch(e){
    if (!isCodeError(e.message)) top_('⛔ ' + e.message, 'bad');
  }
})();
</script>
